<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVault - Your Ultimate Movie Collection</title>
    <link rel="stylesheet" href="./css/main.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Inter', 'Arial', sans-serif;
            background: linear-gradient(135deg, #090909, #0f0f0f, #181818);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .loading-container {
            text-align: center;
            animation: fadeIn 1s ease-in-out;
            z-index: 10;
        }
        
        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ffe066, #d4af37, #f59e0b, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
            letter-spacing: -0.02em;
        }
        
        .tagline {
            font-size: 1.2rem;
            margin-bottom: 35px;
            color: #d4af37;
            opacity: 0.9;
            letter-spacing: 0.05em;
            font-weight: 500;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top: 3px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
        }
        
        .loading-text {
            font-size: 1rem;
            color: #b8b8b8;
            letter-spacing: 0.02em;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(212, 175, 55, 0.3); }
            to { text-shadow: 0 0 35px rgba(212, 175, 55, 0.6), 0 0 50px rgba(212, 175, 55, 0.2); }
        }
        
        .film-reel {
            position: absolute;
            width: 120px;
            height: 120px;
            border: 8px solid rgba(212, 175, 55, 0.06);
            border-radius: 50%;
            animation: rotate 12s linear infinite;
            z-index: 1;
        }
        
        .film-reel:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            background: rgba(212, 175, 55, 0.12);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        }
        
        .film-reel:nth-child(1) { top: -20px; left: -20px; animation-delay: 0s; }
        .film-reel:nth-child(2) { top: -20px; right: -20px; animation-delay: -3s; }
        .film-reel:nth-child(3) { bottom: -20px; left: -20px; animation-delay: -6s; }
        .film-reel:nth-child(4) { bottom: -20px; right: -20px; animation-delay: -9s; }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<script type="module" src="https://static.rocket.new/rocket-web.js?_cfg=https%3A%2F%2Fcinevault6865back.builtwithrocket.new&_be=https%3A%2F%2Fapplication.rocket.new&_v=0.1.8"></script>
</head>
<body>
    <div class="film-reel"></div>
    <div class="film-reel"></div>
    <div class="film-reel"></div>
    <div class="film-reel"></div>
    
    <div class="loading-container">
        <div class="logo">CineVault</div>
        <div class="tagline">Your Ultimate Movie Collection</div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading your cinematic experience...</div>
    </div>

        });
